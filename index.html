<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Business Card Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div id="custom-logo-container">
                <img id="custom-logo" src="" alt="" style="display: none;">
            </div>
            <h1>QR Business Card Generator</h1>
            <p class="subtitle">Create professional digital business cards with QR codes</p>
        </header>

        <div class="main-content">
            <!-- Theme Selection -->
            <section class="card theme-section">
                <h2>🎨 Customize Your Landing Page</h2>
                <div class="theme-selector">
                    <label for="theme">Choose a Theme:</label>
                    <select id="theme">
                        <option value="professional">Professional Blue</option>
                        <option value="modern">Modern Dark</option>
                        <option value="elegant">Elegant Purple</option>
                        <option value="fresh">Fresh Green</option>
                        <option value="warm">Warm Orange</option>
                    </select>
                </div>
                <div class="logo-upload">
                    <label for="logo-upload">Upload Your Logo:</label>
                    <input type="file" id="logo-upload" accept="image/*">
                    <button id="remove-logo-btn" class="btn-secondary">Remove Logo</button>
                </div>
            </section>

            <!-- vCard Form -->
            <section class="card">
                <h2>📇 Contact Information</h2>
                <form id="vcard-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">First Name *</label>
                            <input type="text" id="firstName" required>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Last Name *</label>
                            <input type="text" id="lastName" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="organization">Organization</label>
                        <input type="text" id="organization">
                    </div>

                    <div class="form-group">
                        <label for="title">Job Title</label>
                        <input type="text" id="title">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">Email *</label>
                            <input type="email" id="email" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone</label>
                            <input type="tel" id="phone">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="website">Website</label>
                        <input type="url" id="website" placeholder="https://example.com">
                    </div>

                    <h3>Address</h3>
                    <div class="form-group">
                        <label for="street">Street Address</label>
                        <input type="text" id="street">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">City</label>
                            <input type="text" id="city">
                        </div>
                        <div class="form-group">
                            <label for="state">State/Province</label>
                            <input type="text" id="state">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="zip">ZIP/Postal Code</label>
                            <input type="text" id="zip">
                        </div>
                        <div class="form-group">
                            <label for="country">Country</label>
                            <input type="text" id="country">
                        </div>
                    </div>

                    <h3>Additional Information</h3>
                    <div class="form-group">
                        <label for="linkedin">LinkedIn URL</label>
                        <input type="url" id="linkedin" placeholder="https://linkedin.com/in/yourprofile">
                    </div>

                    <div class="form-group">
                        <label for="twitter">Twitter/X Handle</label>
                        <input type="text" id="twitter" placeholder="@yourusername">
                    </div>

                    <div class="form-group">
                        <label for="note">Notes</label>
                        <textarea id="note" rows="3"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="photo-upload">Profile Photo (optional)</label>
                        <input type="file" id="photo-upload" accept="image/*" onchange="handlePhotoUpload(event)">
                    </div>

                    <button type="button" onclick="generateQR()" class="btn-primary">Generate QR Code</button>
                </form>
            </section>

            <!-- QR Code Display -->
            <section class="card qr-section" id="qr-result" style="display: none;">
                <h2>✅ Your QR Code</h2>
                <div id="qr-code-container"></div>
                <div class="qr-actions">
                    <button id="download-qr-btn" class="btn-primary">Download QR Code</button>
                    <button id="download-vcard-btn" class="btn-secondary">Download vCard File</button>
                    <button id="copy-url-btn" class="btn-secondary">Copy Landing Page URL</button>
                </div>
                <div id="landing-page-url" style="margin-top: 20px;"></div>
            </section>

            <!-- Preview Section -->
            <section class="card preview-section" id="preview-section" style="display: none;">
                <h2>👁️ Landing Page Preview</h2>
                <div id="preview-container" class="preview-frame">
                    <!-- Dynamic preview content -->
                </div>
            </section>
        </div>

        <footer>
            <p>© 2026 QR Business Card Generator - Powered by Azure Static Web Apps</p>
        </footer>
    </div>

    <!-- Include QR Code Library -->
    <script src="qrcode.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
